[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civil3d-mcp"
version = "1.0.0"
description = "FastMCP server for Autodesk Civil 3D via COM automation (pythonnet + win32com)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["civil3d", "autodesk", "mcp", "fastmcp", "com", "automation", "bim"]

dependencies = [
    "fastmcp>=0.4.0",
    "pythonnet>=3.0.3",
    "pywin32>=306",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # 2026-08-18: requirements-dev.txt 와 어긋나 있었다. `pip install -e ".[dev]"`
    # 로는 anthropic 이 빠져 experiments/harness_d.py 가 ImportError 로 죽었다.
    "anthropic>=0.40",
]

[project.scripts]
civil3d-mcp = "civil3d_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 2026-08-18 정정: tests/ 는 존재한 적이 없다. 이 값 때문에 인자 없이 `pytest` 를
# 실행하면 "file or directory not found: tests" 로 종료돼 78건이 한 건도 돌지 않았다.
testpaths = ["test_earthwork_core.py", "test_hydraulics_core.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
